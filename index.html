<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Ram Fast Food</title>

<style>
body { font-family: Arial; margin:0; background:#fff; }

header {
  background:#ff4d4d;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

.container { padding:15px; }

.item {
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:5px;
}

button {
  background:#ff4d4d;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:5px;
}

.cart {
  margin-top:20px;
  padding:10px;
  border-top:2px solid #ddd;
}

.whatsapp {
  display:block;
  margin-top:15px;
  padding:12px;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:5px;
}
</style>
</head>

<body>

<header>Shree Ram Fast Food</header>

<div class="container">

<h2>🍔 Menu</h2>

<div class="item">
  <span>Burger - ₹50</span>
  <button onclick="addItem('Burger ₹50')">Add</button>
</div>

<div class="item">
  <span>Pizza - ₹120</span>
  <button onclick="addItem('Pizza ₹120')">Add</button>
</div>

<div class="item">
  <span>Sandwich - ₹40</span>
  <button onclick="addItem('Sandwich ₹40')">Add</button>
</div>

<div class="item">
  <span>Cold Drink - ₹30</span>
  <button onclick="addItem('Cold Drink ₹30')">Add</button>
</div>

<div class="cart">
  <h3>🛒 Your Order</h3>
  <ul id="cartList"></ul>

  <a id="orderBtn" class="whatsapp" href="#" target="_blank">
    Order on WhatsApp
  </a>
</div>

</div>

<script>
let cart = [];

function addItem(item) {
  cart.push(item);
  displayCart();
}

function displayCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach(i => {
    let li = document.createElement("li");
    li.innerText = i;
    list.appendChild(li);
  });

  let message = "Hello, I want to order:%0A" + cart.join("%0A");
  
  document.getElementById("orderBtn").href =
    "https://wa.me/919999999999?text=" + message;
}
</script>

</body>
</html>
