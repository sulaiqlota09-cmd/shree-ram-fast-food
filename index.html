<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shree Ram Fast Food</title>

<style>
body { font-family: Arial; margin:0; background:#fff; }

header {
  background:#ff4d4d;
  color:white;
  text-align:center;
  padding:15px;
  font-size:22px;
}

.container { padding:15px; }

.item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

.item img {
  width:60px;
  height:60px;
  border-radius:8px;
  object-fit:cover;
}

.item-info {
  flex:1;
  margin-left:10px;
}

button {
  background:#ff4d4d;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:5px;
}

.cart {
  margin-top:20px;
  padding:10px;
  border-top:2px solid #ddd;
}

.order-btn {
  display:block;
  margin-top:15px;
  padding:12px;
  text-align:center;
  background:#ff4d4d;
  color:white;
  border:none;
  border-radius:5px;
  font-size:16px;
}

/* Toast message */
.toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#333;
  color:#fff;
  padding:10px 20px;
  border-radius:5px;
  display:none;
}
</style>
</head>

<body>

<header>Shree Ram Fast Food</header>

<div class="container">

<h2>🍔 Menu</h2>

<div class="item">
  <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
  <div class="item-info">
    <div>Burger - ₹50</div>
  </div>
  <button onclick="addItem('Burger ₹50')">Add</button>
</div>

<div class="item">
  <img src="https://images.unsplash.com/photo-1594007654729-407eedc4be65">
  <div class="item-info">
    <div>Pizza - ₹120</div>
  </div>
  <button onclick="addItem('Pizza ₹120')">Add</button>
</div>

<div class="item">
  <img src="https://images.unsplash.com/photo-1604908176997-4311e3b28c63">
  <div class="item-info">
    <div>Sandwich - ₹40</div>
  </div>
  <button onclick="addItem('Sandwich ₹40')">Add</button>
</div>

<div class="item">
  <img src="https://images.unsplash.com/photo-1586190848861-99aa4a171e90">
  <div class="item-info">
    <div>Cold Drink - ₹30</div>
  </div>
  <button onclick="addItem('Cold Drink ₹30')">Add</button>
</div>

<div class="cart">
  <h3>🛒 Your Cart</h3>
  <ul id="cartList"></ul>

  <button class="order-btn" onclick="placeOrder()">
    Order Now
  </button>
</div>

</div>

<div id="toast" class="toast">Item added to cart</div>

<script>
let cart = [];

function showToast() {
  let toast = document.getElementById("toast");
  toast.style.display = "block";
  setTimeout(() => {
    toast.style.display = "none";
  }, 1500);
}

function addItem(item) {
  cart.push(item);
  displayCart();
  showToast();
}

function displayCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";

  cart.forEach(i => {
    let li = document.createElement("li");
    li.innerText = i;
    list.appendChild(li);
  });
}

function placeOrder() {
  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  let message = "Order:%0A" + cart.join("%0A");
  let number = "918780343199";

  window.open("https://wa.me/" + number + "?text=" + message);
}
</script>

</body>
</html>
