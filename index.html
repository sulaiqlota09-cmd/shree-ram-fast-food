<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Ram Fast Food</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }

        header {
            background-color: #ff4d4d;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 30px;
        }

        .hero img {
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
        }

        .hero h1 {
            margin: 15px 0 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .section {
            padding: 20px;
        }

        .section h2 {
            margin-bottom: 10px;
        }

        .menu-item {
            margin: 8px 0;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f2f2f2;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    Shree Ram Fast Food
</header>

<div class="hero">
    <img src="https://images.unsplash.com/photo-1604908176997-4311e3b28c63" alt="Food Image">
    <h1>Tasty & Fresh Fast Food</h1>
    <p>Order on WhatsApp now!</p>
    <a class="btn" href="https://wa.me/919999999999">Order on WhatsApp</a>
</div>

<div class="section">
    <h2>📍 Location</h2>
    <p>Near Bus Stand, Ahmedabad</p>
    <iframe 
        src="https://maps.google.com/maps?q=ahmedabad&t=&z=13&ie=UTF8&iwloc=&output=embed" 
        width="100%" height="200" style="border:0;">
    </iframe>
</div>

<div class="section">
    <h2>⏰ Timing</h2>
    <p>Monday - Sunday: 10:00 AM - 10:00 PM</p>
</div>

<div class="section">
    <h2>🍔 Menu</h2>
    <div class="menu-item">Burger - ₹50</div>
    <div class="menu-item">Pizza - ₹120</div>
    <div class="menu-item">Sandwich - ₹40</div>
    <div class="menu-item">Cold Drink - ₹30</div>
</div>

<div class="footer">
    © 2026 Shree Ram Fast Food | All Rights Reserved
</div>

</body>
</html>
